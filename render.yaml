services:
  - type: web
    name: ai-sales-agent-whatsapp
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: whatsapp-session
      mountPath: /data/whatsapp-session
      sizeGB: 1
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_SESSION_DIR
        value: /data/whatsapp-session
      - key: AGENT_MODEL
        value: claude-sonnet-5
      - key: FOLLOWUP_CHECK_INTERVAL_CRON
        value: "*/15 * * * *"
      - key: FOLLOWUP_DELAY_MINUTES
        value: 60
      # A renseigner manuellement dans le tableau de bord Render (secrets) :
      - key: MONGODB_URI
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SEED_WHATSAPP_NUMBER
        sync: false
